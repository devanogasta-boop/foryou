<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>A Few Words ♡</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;
    }


    body {

      font-family: Georgia, serif;

      background:
        radial-gradient(
          circle at 50% 40%,
          #164b70 0%,
          #0c3555 35%,
          #08243d 65%,
          #061525 100%
        );

      color: white;
    }


    /* =========================
       MAIN SCREEN
    ========================= */

    .screen {

      width: 100vw;
      height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      position: relative;

      overflow: hidden;

      padding: 25px;
    }


    /* =========================
       SOFT GLOW
    ========================= */

    .screen::before {

      content: "";

      position: absolute;

      width: 70vw;
      height: 70vw;

      max-width: 600px;
      max-height: 600px;

      border-radius: 50%;

      background:
        rgba(100, 190, 240, 0.15);

      filter: blur(80px);

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;
    }


    /* =========================
       CONTENT
    ========================= */

    .content {

      position: relative;

      z-index: 10;

      width: 100%;
      max-width: 500px;

      text-align: center;
    }


    .small-title {

      font-size: 15px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color:
        rgba(220, 245, 255, 0.75);

      margin-bottom: 20px;
    }


    h1 {

      font-size:
        clamp(32px, 8vw, 50px);

      font-weight: normal;

      margin-bottom: 18px;

      text-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.25);
    }


    .instruction {

      color:
        rgba(235, 248, 255, 0.75);

      font-size: 15px;

      margin-bottom: 35px;
    }


    /* =========================
       MESSAGE BOX
    ========================= */

    .message-box {

      min-height: 180px;

      padding: 35px 25px;

      display: flex;

      justify-content: center;
      align-items: center;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.09);

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(12px);

      box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.25);

      margin-bottom: 28px;
    }


    .message {

      font-size:
        clamp(19px, 5vw, 25px);

      line-height: 1.7;

      color: white;

      opacity: 0;

      transform:
        translateY(15px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }


    .message.show {

      opacity: 1;

      transform:
        translateY(0);
    }


    /* =========================
       TAP BUTTON
    ========================= */

    .tap-button {

      border: none;

      padding:
        14px 32px;

      border-radius: 50px;

      background:
        rgba(255, 255, 255, 0.95);

      color: #164b70;

      font-family: Georgia, serif;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.25);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .tap-button:hover {

      transform:
        scale(1.06);
    }


    .tap-button:active {

      transform:
        scale(0.95);
    }


    /* =========================
       COUNTER
    ========================= */

    .counter {

      margin-top: 18px;

      font-size: 13px;

      color:
        rgba(220, 245, 255, 0.6);
    }


    /* =========================
       FLOATING STARS
    ========================= */

    .star {

      position: absolute;

      color:
        rgba(255, 255, 255, 0.7);

      font-size: 16px;

      animation:
        floatStar
        4s
        ease-in-out
        infinite;
    }
