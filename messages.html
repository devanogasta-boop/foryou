<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>A Few Words ♡</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;
    }


    body {

      font-family: Georgia, serif;

      background:
        radial-gradient(
          circle at 50% 40%,
          #164b70 0%,
          #0c3555 35%,
          #08243d 65%,
          #061525 100%
        );

      color: white;
    }


    /* =========================
       MAIN SCREEN
    ========================= */

    .screen {

      width: 100vw;
      height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      position: relative;

      overflow: hidden;

      padding: 25px;
    }


    /* =========================
       SOFT GLOW
    ========================= */

    .screen::before {

      content: "";

      position: absolute;

      width: 70vw;
      height: 70vw;

      max-width: 600px;
      max-height: 600px;

      border-radius: 50%;

      background:
        rgba(100, 190, 240, 0.15);

      filter: blur(80px);

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;
    }


    /* =========================
       CONTENT
    ========================= */

    .content {

      position: relative;

      z-index: 10;

      width: 100%;
      max-width: 500px;

      text-align: center;
    }


    .small-title {

      font-size: 15px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color:
        rgba(220, 245, 255, 0.75);

      margin-bottom: 20px;
    }


    h1 {

      font-size:
        clamp(32px, 8vw, 50px);

      font-weight: normal;

      margin-bottom: 18px;

      text-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.25);
    }


    .instruction {

      color:
        rgba(235, 248, 255, 0.75);

      font-size: 15px;

      margin-bottom: 35px;
    }


    /* =========================
       MESSAGE BOX
    ========================= */

    .message-box {

      min-height: 180px;

      padding: 35px 25px;

      display: flex;

      justify-content: center;
      align-items: center;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.09);

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(12px);

      box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.25);

      margin-bottom: 28px;
    }


    .message {

      font-size:
        clamp(19px, 5vw, 25px);

      line-height: 1.7;

      color: white;

      opacity: 0;

      transform:
        translateY(15px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }


    .message.show {

      opacity: 1;

      transform:
        translateY(0);
    }


    /* =========================
       TAP BUTTON
    ========================= */

    .tap-button {

      border: none;

      padding:
        14px 32px;

      border-radius: 50px;

      background:
        rgba(255, 255, 255, 0.95);

      color: #164b70;

      font-family: Georgia, serif;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.25);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .tap-button:hover {

      transform:
        scale(1.06);
    }


    .tap-button:active {

      transform:
        scale(0.95);
    }


    /* =========================
       COUNTER
    ========================= */

    .counter {

      margin-top: 18px;

      font-size: 13px;

      color:
        rgba(220, 245, 255, 0.6);
    }


    /* =========================
       FLOATING STARS
    ========================= */

    .star {

      position: absolute;

      color:
        rgba(255, 255, 255, 0.7);

      font-size: 16px;

      animation:
        floatStar
        4s
        ease-in-out
        infinite;
    }


    .star:nth-child(1) {
      top: 15%;
      left: 12%;
    }


    .star:nth-child(2) {
      top: 25%;
      right: 15%;
      animation-delay: 1s;
    }


    .star:nth-child(3) {
      bottom: 20%;
      left: 18%;
      animation-delay: 2s;
    }


    .star:nth-child(4) {
      bottom: 15%;
      right: 12%;
      animation-delay: 0.5s;
    }


    @keyframes floatStar {

      0%,
      100% {

        opacity: 0.3;

        transform:
          translateY(0)
          scale(1);
      }


      50% {

        opacity: 1;

        transform:
          translateY(-12px)
          scale(1.2);
      }

    }


    /* =========================
       FINISH
    ========================= */

    .finish {

      display: none;

      animation:
        fadeIn 1s ease;
    }


    .finish.show {

      display: block;
    }


    @keyframes fadeIn {

      from {

        opacity: 0;

        transform:
          translateY(20px);
      }


      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .finish p {

      color:
        rgba(235, 248, 255, 0.8);

      line-height: 1.8;

      margin-bottom: 25px;
    }


    .continue-button {

      border: none;

      padding:
        14px 32px;

      border-radius: 50px;

      background:
        #dff6ff;

      color:
        #0c3555;

      font-family: Georgia, serif;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.25);

      transition:
        transform 0.25s ease;
    }


    .continue-button:active {

      transform:
        scale(0.95);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .message-box {

        min-height: 190px;

        padding:
          30px 20px;
      }


      .message {

        font-size: 20px;
      }

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- =========================
         FLOATING STARS
    ========================= -->

    <div class="star">✦</div>

    <div class="star">✧</div>

    <div class="star">✦</div>

    <div class="star">✧</div>


    <div class="content">


      <!-- =========================
           NORMAL SCREEN
      ========================= -->

      <div id="normalContent">


        <div class="small-title">
          just a little something
        </div>


        <h1>
          For You ♡
        </h1>


        <p class="instruction">
          Tap the button and let me tell you
          a few things.
        </p>


        <div class="message-box">

          <div
            class="message"
            id="message"
          ></div>

        </div>


        <button
          class="tap-button"
          id="tapButton"
        >
          Tap ♡
        </button>


        <div
          class="counter"
          id="counter"
        >
          1 / 5
        </div>


      </div>


      <!-- =========================
           FINISH SCREEN
      ========================= -->

      <div
        class="finish"
        id="finish"
      >


        <div class="small-title">
          and there's more...
        </div>


        <h1>
          One more thing ♡
        </h1>


        <p>
          These little words are only the beginning.
          There's something longer waiting for you.
        </p>


        <button
          class="continue-button"
          id="continueButton"
        >
          Continue ♡
        </button>


      </div>


    </div>


  </main>


  <script>


    /* =========================
       MESSAGES
    ========================= */

    const messages = [

      "You make ordinary days feel a little more special. ♡",

      "Somehow, being with you makes everything feel a little lighter.",

      "I hope you know how much your presence means to me.",

      "If I could keep one feeling forever, it would be the feeling of being with you.",

      "And if I had to choose again, I would still choose you. ♡"

    ];


    let current = 0;


    /* =========================
       ELEMENTS
    ========================= */

    const message =
      document.getElementById(
        "message"
      );


    const tapButton =
      document.getElementById(
        "tapButton"
      );


    const counter =
      document.getElementById(
        "counter"
      );


    const normalContent =
      document.getElementById(
        "normalContent"
      );


    const finish =
      document.getElementById(
        "finish"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    /* =========================
       SOFT POP SOUND
       
       Tidak membutuhkan file audio.
       Suara dibuat langsung oleh browser.
    ========================= */

    let audioContext = null;


    function playPop() {

      try {

        /* =========================
           CREATE AUDIO CONTEXT
        ========================= */

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        /* =========================
           RESUME AUDIO
        ========================= */

        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        /* =========================
           OSCILLATOR
        ========================= */

        const oscillator =
          audioContext.createOscillator();


        /* =========================
           VOLUME
        ========================= */

        const gain =
          audioContext.createGain();


        /* =========================
           SOFT SOUND
        ========================= */

        oscillator.type =
          "sine";


        const frequency = 650;


        oscillator.frequency.setValueAtTime(
          frequency,
          audioContext.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
          880,
          audioContext.currentTime + 0.16
        );


        /* =========================
           SOFT VOLUME
        ========================= */

        gain.gain.setValueAtTime(
          0.08,
          audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.16
        );


        /* =========================
           CONNECT
        ========================= */

        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        /* =========================
           PLAY
        ========================= */

        oscillator.start();


        oscillator.stop(
          audioContext.currentTime +
          0.16
        );


      } catch (error) {

        console.log(
          "Sound unavailable:",
          error
        );

      }

    }


    /* =========================
       SHOW MESSAGE
    ========================= */

    function showMessage() {

      message.classList.remove(
        "show"
      );


      setTimeout(() => {

        message.textContent =
          messages[current];

        message.classList.add(
          "show"
        );

      }, 200);


      counter.textContent =
        (current + 1)
        + " / "
        + messages.length;

    }


    /* =========================
       FIRST MESSAGE
    ========================= */

    showMessage();


    /* =========================
       TAP BUTTON
    ========================= */

    tapButton.addEventListener(
      "click",
      () => {


        /* =========================
           SOFT POP
        ========================= */

        playPop();


        /* =========================
           NEXT MESSAGE
        ========================= */

        current++;


        /* =========================
           FINISH
        ========================= */

        if (
          current >= messages.length
        ) {

          normalContent.style.display =
            "none";


          finish.classList.add(
            "show"
          );


          return;

        }


        /* =========================
           SHOW NEXT
        ========================= */

        showMessage();

      }
    );


    /* =========================
       CONTINUE BUTTON
    ========================= */

    continueButton.addEventListener(
      "click",
      () => {

        /*
          Sedikit suara juga ketika
          Continue ditekan.
        */

        playPop();


        setTimeout(
          () => {

            window.location.href =
              "letters.html";

          },
          150
        );

      }
    );


  </script>


</body>

</html>
