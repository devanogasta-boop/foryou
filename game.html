<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Catch the Hearts ♡</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;
    }


    body {

      font-family: Georgia, serif;

      background: #061525;

      color: white;
    }


    /* =========================
       GAME SCREEN
    ========================= */

    .game {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      align-items: center;

      background:
        radial-gradient(
          circle at 50% 40%,
          #164b70 0%,
          #0c3555 35%,
          #08243d 65%,
          #061525 100%
        );
    }


    /* =========================
       BLUE GLOW
    ========================= */

    .game::before {

      content: "";

      position: absolute;

      width: 75vw;
      height: 75vw;

      max-width: 650px;
      max-height: 650px;

      border-radius: 50%;

      background:
        rgba(55, 160, 220, 0.16);

      filter: blur(80px);

      top: 45%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;

      z-index: 1;
    }


    /* =========================
       STARS
    ========================= */

    .stars {

      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 2;
    }


    .star {

      position: absolute;

      color:
        rgba(220, 248, 255, 0.65);

      font-size: 16px;

      animation:
        twinkle
        2s
        ease-in-out
        infinite alternate;
    }


    .star:nth-child(1) {
      top: 12%;
      left: 15%;
    }

    .star:nth-child(2) {
      top: 20%;
      right: 18%;
      animation-delay: .5s;
    }

    .star:nth-child(3) {
      top: 34%;
      left: 8%;
      animation-delay: 1s;
    }

    .star:nth-child(4) {
      top: 42%;
      right: 10%;
      animation-delay: .8s;
    }

    .star:nth-child(5) {
      bottom: 18%;
      left: 20%;
      animation-delay: .3s;
    }

    .star:nth-child(6) {
      bottom: 25%;
      right: 20%;
      animation-delay: 1.2s;
    }


    @keyframes twinkle {

      from {
        opacity: .25;
        transform: scale(.8);
      }

      to {
        opacity: 1;
        transform: scale(1.3);
      }
    }


    /* =========================
       HEADER
    ========================= */

    .header {

      position: relative;

      z-index: 20;

      text-align: center;

      padding-top: 45px;

      pointer-events: none;
    }


    .header h1 {

      font-size:
        clamp(30px, 8vw, 48px);

      font-weight: normal;

      color: white;

      margin-bottom: 10px;

      text-shadow:
        0 4px 20px
        rgba(80, 190, 255, 0.35);
    }


    .header p {

      font-size: 15px;

      color:
        rgba(225, 245, 255, 0.85);

      text-shadow:
        0 2px 10px
        rgba(0, 0, 0, 0.2);
    }


    /* =========================
       SCORE
    ========================= */

    .score {

      position: relative;

      z-index: 20;

      margin-top: 15px;

      padding:
        9px 22px;

      border-radius: 30px;

      background:
        rgba(255, 255, 255, 0.10);

      border:
        1px solid
        rgba(190, 235, 255, 0.25);

      backdrop-filter:
        blur(10px);

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.25);

      color:
        #dff6ff;

      font-size: 15px;
    }


    /* =========================
       PLAY AREA
    ========================= */

    .play-area {

      position: absolute;

      inset: 0;

      z-index: 5;
    }


    /* =========================
       HEART
    ========================= */

    .heart {

      position: absolute;

      width: 70px;
      height: 70px;

      display: flex;

      justify-content: center;
      align-items: center;

      font-size: 48px;

      cursor: pointer;

      user-select: none;

      color:
        #9ee8ff;

      text-shadow:

        0 0 10px
        rgba(90, 210, 255, 0.9),

        0 0 25px
        rgba(60, 180, 255, 0.7),

        0 0 45px
        rgba(60, 180, 255, 0.4);

      animation:
        floatHeart
        1.5s
        ease-in-out
        infinite alternate;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    .heart:active {

      transform:
        scale(0.7);
    }


    @keyframes floatHeart {

      from {

        transform:
          translateY(-7px)
          rotate(-8deg);
      }

      to {

        transform:
          translateY(7px)
          rotate(8deg);
      }
    }


    /* =========================
       FOUND HEART
    ========================= */

    .heart.found {

      opacity: 0;

      transform:
        scale(2.2);
    }


    /* =========================
       SPARKLE
    ========================= */

    .sparkle {

      position: absolute;

      pointer-events: none;

      color:
        #dff8ff;

      font-size: 22px;

      text-shadow:
        0 0 15px
        #75d9ff;

      animation:
        sparkle
        0.8s
        ease-out
        forwards;
    }


    @keyframes sparkle {

      0% {

        opacity: 1;

        transform:
          scale(0.5);
      }

      100% {

        opacity: 0;

        transform:
          scale(1.8)
          translateY(-30px);
      }
    }


    /* =========================
       FINISH SCREEN
    ========================= */

    .finish {

      position: absolute;

      inset: 0;

      z-index: 50;

      display: flex;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 30px;

      background:
        rgba(3, 15, 27, 0.94);

      backdrop-filter:
        blur(10px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.8s ease;
    }


    .finish.show {

      opacity: 1;

      pointer-events: auto;
    }


    .finish-box {

      max-width: 400px;

      animation:
        finishAppear
        0.8s
        ease forwards;
    }


    @keyframes finishAppear {

      from {

        opacity: 0;

        transform:
          translateY(20px)
          scale(0.9);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .finish-box h2 {

      font-size:
        clamp(30px, 8vw, 46px);

      font-weight: normal;

      color: white;

      margin-bottom: 15px;

      text-shadow:
        0 0 20px
        rgba(100, 210, 255, 0.5);
    }


    .finish-box p {

      color:
        rgba(225, 245, 255, 0.82);

      line-height: 1.7;

      margin-bottom: 28px;
    }


    /* =========================
       CONTINUE BUTTON
    ========================= */

    .continue {

      border: none;

      padding:
        14px 32px;

      border-radius: 40px;

      background:
        #dff8ff;

      color:
        #16476a;

      font-family: Georgia, serif;

      font-size: 15px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(60, 180, 255, 0.25);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }


    .continue:hover {

      transform:
        scale(1.07);

      box-shadow:
        0 15px 35px
        rgba(60, 180, 255, 0.4);
    }


    .continue:active {

      transform:
        scale(0.95);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {

        padding-top: 38px;
      }


      .header h1 {

        font-size: 32px;
      }


      .header p {

        font-size: 14px;
      }


      .heart {

        width: 62px;
        height: 62px;

        font-size: 43px;
      }

    }

  </style>

</head>


<body>


  <main class="game">


    <!-- STARS -->

    <div class="stars">

      <span class="star">✦</span>
      <span class="star">✧</span>
      <span class="star">✦</span>
      <span class="star">˚</span>
      <span class="star">✧</span>
      <span class="star">✦</span>

    </div>


    <!-- HEADER -->

    <div class="header">

      <h1>
        Catch the Hearts ♡
      </h1>

      <p>
        Catch 7 little hearts to continue...
      </p>

      <div
        class="score"
        id="score"
      >
        0 / 7
      </div>

    </div>


    <!-- PLAY AREA -->

    <div
      class="play-area"
      id="playArea"
    ></div>


    <!-- FINISH -->

    <div
      class="finish"
      id="finish"
    >

      <div class="finish-box">

        <h2>
          You found them all ♡
        </h2>

        <p>
          But I left a few little words
          waiting for you...
        </p>

        <button
          class="continue"
          id="continueButton"
        >
          Continue ♡
        </button>

      </div>

    </div>


  </main>


  <!-- =========================
       BACKGROUND MUSIC
  ========================= -->

  <audio
    id="bgMusic"
    src="You Da One Rihanna.mp3"
    preload="auto"
  ></audio>


  <script>


    /* =========================
       ELEMENTS
    ========================= */

    const playArea =
      document.getElementById(
        "playArea"
      );


    const scoreText =
      document.getElementById(
        "score"
      );


    const finish =
      document.getElementById(
        "finish"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    /* =========================
       BACKGROUND MUSIC
    ========================= */

    const bgMusic =
      document.getElementById(
        "bgMusic"
      );


    const savedMusicTime =
      parseFloat(
        localStorage.getItem(
          "musicTime"
        )
      ) || 0;


    /*
      Lanjutkan lagu dari posisi
      terakhir di halaman bunga.
    */

    bgMusic.currentTime =
      savedMusicTime;


    /*
      Volume lagu background.
      Bisa diubah kalau terlalu
      keras atau terlalu pelan.
    */

    bgMusic.volume = 0.45;


    /*
      Coba lanjutkan lagu.
    */

    bgMusic.play().catch(() => {

      /*
        Browser mungkin menunggu
        interaksi pengguna.
      */

    });


    let score = 0;

    const target = 7;


    /* =========================
       BUTTON / HEART SOUND
    ========================= */

    let audioContext = null;


    function playSound(
      frequency = 700,
      duration = 0.15
    ) {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.setValueAtTime(
          frequency,
          audioContext.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
          frequency * 1.35,
          audioContext.currentTime + duration
        );


        gain.gain.setValueAtTime(
          0.12,
          audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + duration
        );


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime +
          duration
        );

      } catch (error) {

        console.log(
          "Sound unavailable:",
          error
        );

      }

    }


    /* =========================
       RANDOM POSITION
    ========================= */

    function randomPosition() {

      const screenWidth =
        window.innerWidth;

      const screenHeight =
        window.innerHeight;


      const x =
        20 +
        Math.random()
        * (screenWidth - 90);


      const y =
        150 +
        Math.random()
        * (screenHeight - 240);


      return {
        x,
        y
      };

    }


    /* =========================
       CREATE HEART
    ========================= */

    function createHeart() {

      const heart =
        document.createElement(
          "div"
        );


      heart.classList.add(
        "heart"
      );


      heart.textContent =
        "♡";


      const position =
        randomPosition();


      heart.style.left =
        position.x + "px";


      heart.style.top =
        position.y + "px";


      playArea.appendChild(
        heart
      );


      heart.addEventListener(
        "click",
        () => {

          collectHeart(
            heart
          );

        }
      );

    }


    /* =========================
       COLLECT HEART
    ========================= */

    function collectHeart(
      heart
    ) {

      if (
        heart.classList.contains(
          "found"
        )
      ) {

        return;
      }


      /*
        Sound saat heart disentuh.
      */

      playSound(
        700 + Math.random() * 180,
        0.13
      );


      score++;


      scoreText.textContent =
        score + " / " + target;


      createSparkle(
        heart
      );


      heart.classList.add(
        "found"
      );


      setTimeout(
        () => {

          heart.remove();


          if (
            score < target
          ) {

            createHeart();

          } else {

            showFinish();

          }

        },
        250
      );

    }


    /* =========================
       SPARKLE
    ========================= */

    function createSparkle(
      heart
    ) {

      const sparkle =
        document.createElement(
          "div"
        );


      sparkle.classList.add(
        "sparkle"
      );


      sparkle.textContent =
        "✦";


      sparkle.style.left =
        heart.offsetLeft + "px";


      sparkle.style.top =
        heart.offsetTop + "px";


      playArea.appendChild(
        sparkle
      );


      setTimeout(
        () => {

          sparkle.remove();

        },
        800
      );

    }


    /* =========================
       FINISH
    ========================= */

    function showFinish() {

      setTimeout(
        () => {

          finish.classList.add(
            "show"
          );


          /*
            Sound saat pesan selesai muncul.
          */

          playSound(
            850,
            0.25
          );

        },
        500
      );

    }


    /* =========================
       START GAME
    ========================= */

    createHeart();


    /* =========================
       CONTINUE BUTTON
    ========================= */

    continueButton.addEventListener(
      "click",
      () => {


        /*
          Simpan posisi lagu sebelum
          pindah ke messages.html.
        */

        localStorage.setItem(
          "musicTime",
          bgMusic.currentTime
        );


        /*
          Sound tombol Continue.
        */

        playSound(
          900,
          0.16
        );


        /*
          Beri waktu sebentar supaya
          suara tombol terdengar.
        */

        setTimeout(
          () => {

            window.location.href =
              "messages.html";

          },
          170
        );

      }
    );


  </script>


</body>

</html>
