<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ♡</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #fff4f8;
      font-family: Georgia, serif;
    }


    /* =========================
       OPENING SCREEN
    ========================= */

    .opening {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #fffafd 0%,
          #f8dce8 100%
        );
    }


    /* =========================
       CENTER CONTENT
    ========================= */

    .content {
      position: relative;

      z-index: 100;

      text-align: center;

      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }


    .content.hide {
      opacity: 0;

      transform:
        scale(0.75);

      pointer-events: none;
    }


    h1 {
      color: #7d4058;

      font-size:
        clamp(38px, 9vw, 62px);

      margin-bottom: 12px;
    }


    p {
      color: #986579;

      font-size: 17px;

      margin-bottom: 30px;
    }


    /* =========================
       BUTTON
    ========================= */

    button {
      border: none;

      outline: none;

      padding:
        15px 34px;

      border-radius: 50px;

      background: #9b5872;

      color: white;

      font-family: Georgia, serif;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 10px 30px
        rgba(100, 40, 70, 0.25);

      transition:
        transform 0.3s ease;
    }


    button:hover {
      transform:
        scale(1.08);
    }


    button:active {
      transform:
        scale(0.95);
    }


    /* =========================
       FLOWERS
    ========================= */

    .flower {

      position: absolute;

      left: 50%;
      top: 50%;

      width:
        var(--size);

      height:
        var(--size);

      object-fit: contain;

      pointer-events: none;

      opacity: 0;

      z-index: 50;

      transform-origin: center center;

      /*
        Membantu gambar bunga
        menyatu dengan background.
      */

      mix-blend-mode: multiply;

      transform:
        translate(-50%, -50%)
        scale(0.05)
        rotate(0deg);
    }


    /* =========================
       FLOWER SPRAY
    ========================= */

    .flower.spray {

      animation:
        flowerSpray
        var(--duration)
        cubic-bezier(.15, .75, .25, 1)
        forwards;
    }


    @keyframes flowerSpray {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0.05)
          rotate(0deg);
      }


      12% {

        opacity: 1;
      }


      100% {

        opacity: 1;

        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(var(--scale))
          rotate(var(--rotation));
      }
    }


    /* =========================
       FULL SCREEN MOMENT
    ========================= */

    .flower.full {

      animation:
        flowerPulse
        0.8s
        ease-in-out
        forwards;
    }


    @keyframes flowerPulse {

      0% {

        opacity: 1;

        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(var(--scale))
          rotate(var(--rotation));
      }


      50% {

        opacity: 1;

        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(
            calc(var(--scale) * 1.35)
          )
          rotate(
            calc(var(--rotation) + 20deg)
          );
      }


      100% {

        opacity: 1;

        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(var(--scale))
          rotate(
            calc(var(--rotation) + 40deg)
          );
      }
    }


    /* =========================
       SPLIT LEFT
    ========================= */

    .flower.split-left {

      animation:
        splitLeft
        1.4s
        cubic-bezier(.7, 0, .2, 1)
        forwards;
    }


    @keyframes splitLeft {

      0% {

        opacity: 1;

        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(var(--scale))
          rotate(
            calc(var(--rotation) + 40deg)
          );
      }


      100% {

        opacity: 0;

        transform:
          translate(
            calc(-50% + var(--x) - 110vw),
            calc(-50% + var(--y) + 15vh)
          )
          scale(0.65)
          rotate(
            calc(var(--rotation) - 360deg)
          );
      }
    }


    /* =========================
       SPLIT RIGHT
    ========================= */

    .flower.split-right {

      animation:
        splitRight
        1.4s
        cubic-bezier(.7, 0, .2, 1)
        forwards;
    }


    @keyframes splitRight {

      0% {

        opacity: 1;

        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(var(--scale))
          rotate(
            calc(var(--rotation) + 40deg)
          );
      }


      100% {

        opacity: 0;

        transform:
          translate(
            calc(-50% + var(--x) + 110vw),
            calc(-50% + var(--y) - 15vh)
          )
          scale(0.65)
          rotate(
            calc(var(--rotation) + 360deg)
          );
      }
    }


    /* =========================
       WHITE FLASH
    ========================= */

    .flash {

      position: fixed;

      inset: 0;

      background: white;

      opacity: 0;

      pointer-events: none;

      z-index: 200;
    }


    .flash.active {

      animation:
        flashEffect
        0.8s
        ease;
    }


    @keyframes flashEffect {

      0% {
        opacity: 0;
      }

      40% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      h1 {
        font-size: 40px;
      }

      p {
        font-size: 15px;
      }

      button {
        padding:
          14px 28px;
      }

    }

  </style>
</head>


<body>


  <main
    class="opening"
    id="opening"
  >


    <div
      class="content"
      id="content"
    >

      <h1>
        For You ♡
      </h1>


      <p>
        A little place made just for you.
      </p>


      <button
        id="startButton"
      >
        Tap to Begin ♡
      </button>

    </div>


    <div
      class="flash"
      id="flash"
    ></div>


  </main>


  <script>


    /* =========================
       ELEMENTS
    ========================= */

    const opening =
      document.getElementById("opening");

    const content =
      document.getElementById("content");

    const startButton =
      document.getElementById("startButton");

    const flash =
      document.getElementById("flash");


    let started = false;


    /* =========================
       FLOWER IMAGES
    ========================= */

    const flowerImages = [

      "pink flower.png",

      "yellow flower.png",

      "blue flower.png"

    ];


    /* =========================
       CREATE FLOWER
    ========================= */

    function createFlower(index) {

      const flower =
        document.createElement("img");


      flower.classList.add("flower");


      /*
        Pilih warna bunga
        secara random.
      */

      flower.src =
        flowerImages[
          Math.floor(
            Math.random()
            * flowerImages.length
          )
        ];


      /*
        Ukuran bunga.

        Dibuat cukup besar
        untuk memenuhi layar HP.
      */

      const size =
        110 +
        Math.random() * 170;


      flower.style.setProperty(
        "--size",
        size + "px"
      );


      /*
        Posisi akhir.

        Bunga akan menyebar
        ke seluruh layar.
      */

      const x =
        (Math.random() - 0.5)
        * window.innerWidth
        * 2.2;


      const y =
        (Math.random() - 0.5)
        * window.innerHeight
        * 2.2;


      flower.style.setProperty(
        "--x",
        x + "px"
      );


      flower.style.setProperty(
        "--y",
        y + "px"
      );


      /*
        Scale random.
      */

      const scale =
        0.7 +
        Math.random() * 1.5;


      flower.style.setProperty(
        "--scale",
        scale
      );


      /*
        Rotation random.

        Bisa berputar
        beberapa kali.
      */

      const rotation =
        (Math.random() - 0.5)
        * 1080;


      flower.style.setProperty(
        "--rotation",
        rotation + "deg"
      );


      /*
        Durasi random.

        Biar bunga tidak
        bergerak bersamaan.
      */

      const duration =
        1.7 +
        Math.random() * 1.2;


      flower.style.setProperty(
        "--duration",
        duration + "s"
      );


      /*
        Delay random sedikit.
      */

      flower.style.animationDelay =
        Math.random() * 0.35
        + "s";


      flower.dataset.index =
        index;


      opening.appendChild(
        flower
      );


      return flower;
    }


    /* =========================
       START FLOWER SHOW
    ========================= */

    function startFlowerShow() {


      if (started) {
        return;
      }


      started = true;


      /*
        Hilangkan tulisan
        dan tombol.
      */

      content.classList.add(
        "hide"
      );


      const flowers = [];


      /*
        70 bunga.
      */

      for (
        let i = 0;
        i < 70;
        i++
      ) {

        const flower =
          createFlower(i);


        flowers.push(
          flower
        );

      }


      /*
        Mulai spray.
      */

      requestAnimationFrame(
        () => {

          flowers.forEach(
            (flower) => {

              flower.classList.add(
                "spray"
              );

            }
          );

        }
      );


      /*
        Setelah spray,
        masuk ke momen
        layar penuh bunga.
      */

      setTimeout(
        () => {

          flowers.forEach(
            (flower) => {

              flower.classList.remove(
                "spray"
              );


              flower.classList.add(
                "full"
              );

            }
          );

        },
        2600
      );


      /*
        Setelah itu bunga
        terbang ke kiri
        dan kanan.
      */

      setTimeout(
        () => {

          flash.classList.add(
            "active"
          );


          flowers.forEach(
            (flower, index) => {

              flower.classList.remove(
                "full"
              );


              if (
                index % 2 === 0
              ) {

                flower.classList.add(
                  "split-left"
                );

              } else {

                flower.classList.add(
                  "split-right"
                );

              }

            }
          );

        },
        4600
      );


      /*
        Setelah animasi selesai,
        buka letters.html.
      */

      setTimeout(
        () => {

          window.location.href =
            "letters.html";

        },
        6200
      );

    }


    /* =========================
       BUTTON EVENT
    ========================= */

    startButton.addEventListener(
      "click",
      startFlowerShow
    );


  </script>


</body>
</html>
