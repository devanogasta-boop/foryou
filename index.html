<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #fff7fa, #f8dce7);
    }

    .opening {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 25px;
    }

    h1 {
      font-size: 46px;
      color: #7d4058;
      margin-bottom: 15px;
    }

    p {
      color: #986579;
      font-size: 17px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 15px 32px;
      border-radius: 30px;
      background: #9b5872;
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(120, 60, 85, 0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    .flower {
      position: absolute;
      font-size: 38px;
      user-select: none;
      animation: float 5s ease-in-out infinite;
    }

    .f1 {
      top: 8%;
      left: 10%;
    }

    .f2 {
      top: 15%;
      right: 12%;
      animation-delay: 1s;
    }

    .f3 {
      bottom: 12%;
      left: 13%;
      animation-delay: 2s;
    }

    .f4 {
      bottom: 10%;
      right: 10%;
      animation-delay: 3s;
    }

    .f5 {
      top: 45%;
      left: 5%;
      animation-delay: 1.5s;
    }

    .f6 {
      top: 50%;
      right: 5%;
      animation-delay: 2.5s;
    }

    .petal {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      font-size: 27px;
      left: 50%;
      top: 50%;
      animation: spread 2s ease-out forwards;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(10deg);
      }
    }
