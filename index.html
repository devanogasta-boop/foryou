<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #fff7fa, #f8dce7);
    }

    .opening {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 25px;
    }

    h1 {
      font-size: 46px;
      color: #7d4058;
      margin-bottom: 15px;
    }

    p {
      color: #986579;
      font-size: 17px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 15px 32px;
      border-radius: 30px;
      background: #9b5872;
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(120, 60, 85, 0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    .flower {
      position: absolute;
      font-size: 38px;
      user-select: none;
      animation: float 5s ease-in-out infinite;
    }

    .f1 {
      top: 8%;
      left: 10%;
    }

    .f2 {
      top: 15%;
      right: 12%;
      animation-delay: 1s;
    }

    .f3 {
      bottom: 12%;
      left: 13%;
      animation-delay: 2s;
    }

    .f4 {
      bottom: 10%;
      right: 10%;
      animation-delay: 3s;
    }

    .f5 {
      top: 45%;
      left: 5%;
      animation-delay: 1.5s;
    }

    .f6 {
      top: 50%;
      right: 5%;
      animation-delay: 2.5s;
    }

    .petal {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      font-size: 27px;
      left: 50%;
      top: 50%;
      animation: spread 2s ease-out forwards;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(10deg);
      }
    }

    @keyframes spread {
      0% {
        transform: translate(0, 0) scale(0.3) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translate(
            calc((var(--x) - 50) * 2vw),
            calc((var(--y) - 50) * 2vh)
          )
          scale(1.4)
          rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 35px;
      }

      p {
        font-size: 15px;
      }

      .flower {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="opening" id="opening">

    <div class="flower f1">🌸</div>
    <div class="flower f2">🌷</div>
    <div class="flower f3">🌹</div>
    <div class="flower f4">🌸</div>
    <div class="flower f5">🌼</div>
    <div class="flower f6">🌷</div>

    <div class="content">
      <h1>For You ♡</h1>

      <p>A little place made just for you.</p>

      <button onclick="openStory()">
        Tap to Begin ♡
      </button>
    </div>

  </div>

  <script>
    function openStory() {

      const opening = document.getElementById("opening");

      const flowers = ["🌸", "🌷", "🌹", "🌼", "💮"];

      for (let i = 0; i < 40; i++) {

        const petal = document.createElement("div");

        petal.classList.add("petal");

        petal.innerText =
          flowers[Math.floor(Math.random() * flowers.length)];

        petal.style.setProperty(
          "--x",
          Math.random() * 100
        );

        petal.style.setProperty(
          "--y",
          Math.random() * 100
        );

        opening.appendChild(petal);

        setTimeout(() => {
          petal.remove();
        }, 2000);
      }

      setTimeout(() => {
        alert("Our little story is about to begin... ♡");
      }, 900);
    }
  </script>

</body>
</html>
